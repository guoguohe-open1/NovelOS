[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "novelos"
version = "0.1.0"
description = "NovelOS modular monolith backend"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.20.0",
  "fastapi==0.156.4",
  "psycopg[binary]==3.3.6",
  "pydantic-settings==2.16.1",
  "sqlalchemy==2.1.5",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "httpx2==2.15.1",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "ruff==0.17.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/novelos"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "migrations"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires an explicitly selected disposable PostgreSQL database"]
